[behave]
paths = app/features
default_tags = ~@skip
format = pretty
show_skipped = false
show_timings = false
logging_level = DEBUG
logging_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
stderr_capture = false
stdout_capture = false
stop_on_failure = false
screenshot_on_failure = false
log_capture = true
junit_directory = report
junit = true
